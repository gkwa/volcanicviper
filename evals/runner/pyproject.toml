[project]
name = "evalrunner"
version = "0.1.0"
description = "Run skill eval cases through the Claude CLI and score the verdicts"
readme = "README.md"
authors = [
    { name = "Taylor Monacelli", email = "taylormonacelli@gmail.com" }
]
requires-python = ">=3.13"
dependencies = ["polars"]

[project.scripts]
evalrunner = "evalrunner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
preview = true

[tool.ruff.lint]
select = ["F", "E", "W"]
extend-select = ["I"]
extend-safe-fixes = ["F401", "F841"]
